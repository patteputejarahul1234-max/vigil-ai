apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigilai-frontend
  labels:
    app: vigilai-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vigilai-frontend
  template:
    metadata:
      labels:
        app: vigilai-frontend
    spec:
      containers:
        - name: vigilai-frontend
          image: vigilai-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: vigilai-frontend-service
spec:
  selector:
    app: vigilai-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
