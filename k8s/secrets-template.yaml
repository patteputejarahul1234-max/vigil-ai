# Template only — copy this to secrets.yaml, fill in real base64-encoded
# values, and NEVER commit secrets.yaml to git (add it to .gitignore).
# Encode a value with: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: vigilai-secrets
type: Opaque
data:
  jwt-secret: <base64-encoded-jwt-secret>
  gemini-api-key: <base64-encoded-gemini-key>
  db-password: <base64-encoded-db-password>
  db-root-password: <base64-encoded-db-root-password>
