# Test profile: force in-memory cache (no Redis needed to run tests)
# and non-empty OAuth placeholders (Spring Security won't start otherwise).
spring:
  cache:
    type: simple
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: [ profile, email ]
          github:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: [ read:user, user:email ]

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-not-for-production-use
