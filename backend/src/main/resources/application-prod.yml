# Activated via SPRING_PROFILES_ACTIVE=prod for a managed cloud deploy
# (Render, Railway, Fly.io, AWS, etc.) that isn't using docker-compose —
# i.e. a platform that gives you a managed MySQL/Postgres + Redis
# instance and injects connection details as env vars.
#
# Most platforms give a single DATABASE_URL rather than separate
# host/user/password — set DB_URL/DB_USERNAME/DB_PASSWORD to whatever
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:vigilai}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false

  h2:
    console:
      enabled: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: ${CACHE_TYPE:simple}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}

logging:
  level:
    com.vigilai: INFO
