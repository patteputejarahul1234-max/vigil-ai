spring.cache.type=simple

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=false

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-client-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.frontend-url=http://localhost:5173
app.jwt.secret=test-secret-key-for-unit-tests-only-not-for-production-use-at-all
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000
app.verification-token-expiry-ms=86400000
app.reset-token-expiry-ms=1800000
app.upload-dir=target/test-uploads
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=false
management.health.mail.enabled=false